# Local test server. Mirrors what the cloud server will run.
# Usage (from this folder):  docker compose up      then connect to localhost:25565
services:
  # Serves ../pack locally, for testing pack changes before pushing them.
  # Use it with:  PACKWIZ_URL=http://pack/pack.toml docker compose --profile local-pack up -d
  pack:
    image: nginx:1.27-alpine
    profiles: [local-pack]
    volumes:
      - ../pack:/usr/share/nginx/html:ro

  mc:
    image: itzg/minecraft-server:java25
    ports:
      - "25565:25565"       # Minecraft (Java)
      - "24454:24454/udp"   # Simple Voice Chat
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "26.3"
      FABRIC_LOADER_VERSION: "0.20.1"
      # Published from pack/ by .github/workflows/publish-pack.yml
      PACKWIZ_URL: ${PACKWIZ_URL:-https://samueldpackard.github.io/friends-smp/pack.toml}
      MEMORY: 4G                            # cloud server will use ~10G
      USE_AIKAR_FLAGS: "true"
      MOTD: "Friends SMP (local test)"
      DIFFICULTY: normal
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 8
      ENABLE_WHITELIST: "false"             # turned on in the cloud
    volumes:
      - ./data:/data
    tty: true
    stdin_open: true
